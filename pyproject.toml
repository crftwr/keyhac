[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keyhac"
description = "Keyhac 2 - Python-scriptable keyboard customization tool for Windows and macOS"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "craftware" }]
dynamic = ["version"]
dependencies = [
    # Until the window-management extensions ship in a PuiKit release, dev
    # installs use the sibling checkout: the Makefile venv target runs
    # `pip install -e ../puikit` (branch keyhac-window-extensions / PR #76).
    "puikit>=1.0.3",
    'pyobjc-framework-Cocoa>=10; sys_platform == "darwin"',
    'pyobjc-framework-Quartz>=10; sys_platform == "darwin"',
    'pyobjc-framework-ApplicationServices>=10; sys_platform == "darwin"',
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
keyhac = "keyhac.main:main"

[tool.setuptools]
packages = [
    "keyhac",
    "keyhac.core",
    "keyhac.platform",
    "keyhac.platform.mac",
    "keyhac.platform.win",
    "keyhac.ui",
]

[tool.setuptools.dynamic]
version = { attr = "keyhac.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: drives a real third-party app (launches it, waits on its UI); run with -m 'not slow' to skip",
]
