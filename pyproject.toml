[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keyhac"
description = "Keyhac 2 - Python-scriptable keyboard customization tool for Windows and macOS"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "craftware" }]
dynamic = ["version"]
dependencies = [
    # 1.0.6 covers everything keyhac uses except set_tray(image=) (puikit
    # PR #82, merged but unreleased) — ui/tray.py feature-detects that and
    # degrades to the default icon. To develop against a local checkout,
    # set PUIKIT_DIR (see Makefile).
    "puikit>=1.0.6",
    'pyobjc-framework-Cocoa>=10; sys_platform == "darwin"',
    'pyobjc-framework-Quartz>=10; sys_platform == "darwin"',
    'pyobjc-framework-ApplicationServices>=10; sys_platform == "darwin"',
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
keyhac = "keyhac.main:main"

[tool.setuptools]
packages = [
    "keyhac",
    "keyhac.core",
    "keyhac.platform",
    "keyhac.platform.mac",
    "keyhac.platform.win",
    "keyhac.ui",
]

[tool.setuptools.dynamic]
version = { attr = "keyhac.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: drives a real third-party app (launches it, waits on its UI); run with -m 'not slow' to skip",
]
