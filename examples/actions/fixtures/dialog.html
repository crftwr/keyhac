<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Queue — confirm each item</title></head>
<body>
  <h1>Approval queue</h1>
  <p id="status">3 items pending</p>
  <button type="button" id="next-item">Review next item</button>

  <dialog id="confirm">
    <h2 id="confirm-title">Approve this item?</h2>
    <p id="confirm-detail">REC-001 — item 1 — 37</p>
    <button type="button" id="approve">Approve</button>
    <button type="button" id="reject">Reject</button>
  </dialog>

  <!-- The dialog an action must refuse to touch: same shape, different
       meaning. A handler that presses "the first button" deletes things. -->
  <dialog id="danger">
    <h2 id="danger-title">Delete all records?</h2>
    <button type="button" id="delete-all">Delete</button>
    <button type="button" id="cancel">Cancel</button>
  </dialog>

  <p id="log"></p>

  <script>
    const items = ["REC-001 — item 1 — 37", "REC-002 — item 2 — 74",
                   "REC-003 — item 3 — 111"];
    let index = 0, approved = 0;
    const $ = id => document.getElementById(id);
    // What happened on this screen, told to the clean room's server so a
    // case's check reads the record rather than the room's account of it
    // (issue #193). Opened from file://, as the examples are, there is no
    // server and the request fails quietly - nothing on the page changes.
    const report = (what, detail) => {
      try {
        fetch('event', {method: 'POST', body: JSON.stringify(
          Object.assign({page: location.pathname.split('/').pop(), what}, detail))})
          .catch(() => {});
      } catch (e) {}
    };

    $('next-item').onclick = () => {
      if (index >= items.length) {
        // Every third run, show the *other* dialog, so a handler that does
        // not check its preconditions is caught doing the wrong thing.
        report('danger-shown');
        $('danger').showModal();
        return;
      }
      $('confirm-detail').textContent = items[index];
      $('confirm').showModal();
    };
    $('approve').onclick = () => {
      report('approve', {item: items[index]});
      approved += 1; index += 1;
      $('confirm').close();
      $('status').textContent = (items.length - index) + " items pending";
      $('log').textContent = "approved " + approved;
    };
    $('reject').onclick = () => {
      report('reject', {item: items[index]});
      index += 1; $('confirm').close();
    };
    $('cancel').onclick = () => { report('cancel'); $('danger').close(); };
    $('delete-all').onclick = () => {
      report('delete-all');
      $('log').textContent = "DESTROYED - a handler pressed the wrong button";
      $('danger').close();
    };
  </script>
</body>
</html>
