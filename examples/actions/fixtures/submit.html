<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Submit a record</title></head>
<body>
  <h1>New record</h1>
  <form id="entry">
    <label for="ref">Reference</label>
    <input id="ref" type="text">
    <label for="title">Title</label>
    <input id="title" type="text">
    <label for="amount">Amount</label>
    <input id="amount" type="text">
    <label for="urgent">Urgent</label>
    <input id="urgent" type="checkbox">
    <button type="button" id="submit">Submit</button>
  </form>
  <p id="result"></p>
  <ul id="accepted"></ul>
  <script>
    const $ = id => document.getElementById(id);
    // What happened on this screen, told to the clean room's server so a
    // case's check reads the record rather than the room's account of it
    // (issue #193). Opened from file://, as the examples are, there is no
    // server and the request fails quietly - nothing on the page changes.
    const report = (what, detail) => {
      try {
        fetch('event', {method: 'POST', body: JSON.stringify(
          Object.assign({page: location.pathname.split('/').pop(), what}, detail))})
          .catch(() => {});
      } catch (e) {}
    };
    const seen = new Set();
    $('submit').onclick = () => {
      const ref = $('ref').value.trim();
      const amount = $('amount').value.trim();
      const answer = text => {
        $('result').textContent = text;
        report('submit', {ref, title: $('title').value, amount,
                          urgent: $('urgent').checked, answer: text});
      };
      // Server-side validation, the kind an action has to read back. Every
      // answer names the record it is about: the line is rewritten in place,
      // so two rows refused for the same reason would otherwise leave an
      // action reading the previous row's answer as this one's.
      if (!ref) { answer("error: Reference is required"); return; }
      if (!/^\d+$/.test(amount)) {
        answer("error: " + ref + ": Amount must be a number"); return; }
      if (seen.has(ref)) {
        answer("error: " + ref + ": already submitted"); return; }
      seen.add(ref);
      const li = document.createElement('li');
      li.textContent = ref + " | " + $('title').value + " | " + amount +
                       ($('urgent').checked ? " | URGENT" : "");
      $('accepted').appendChild(li);
      answer("accepted " + ref);
      ['ref','title','amount'].forEach(i => $(i).value = "");
      $('urgent').checked = false;
    };
  </script>
</body></html>
