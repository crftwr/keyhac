<!-- The macOS menu bar extra: the keycap from keyhac-win's icon.svg as an
     AppKit template image, loaded directly by NSImage at runtime (macOS
     11+). Maintained by hand, in step with art/icon.svg: same geometry,
     but ink opacity replaces the face colors (template rendering keeps
     only alpha; the system recolors for dark mode / menu highlight).
     Keep it inside the SVG subset of tools/svgrender.py - the icon build
     (tools/make_icons.py) lints this file against it. -->
<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
     viewBox="0 0 18 18">
  <g transform="translate(-2.9171 -7.1372) scale(0.033242)">
    <path d="M240 312.4 L220 512.4 L134 658.5 L172.5 365 Z" fill="#000" fill-opacity="0.196"/>
    <path d="M240 312.4 L470 312.4 L490 512.4 L220 512.4 Z" fill="#000" fill-opacity="0.376"/>
    <path d="M470 312.4 L544 364 L583 658 L490 512.4 Z" fill="#000" fill-opacity="0.502"/>
    <path d="M220 512.4 L490 512.4 L583 658 L134 658.5 Z" fill="#000" fill-opacity="0.243"/>
    <path d="M240 312.4 L470 312.4 L544 364 L583 658 L134 658.5 L172.5 365 Z" fill="none" stroke="#000"
          stroke-width="60" stroke-linejoin="round"/>
    <path d="M240 312.4 L220 512.4 M220 512.4 L490 512.4 M470 312.4 L490 512.4 M220 512.4 L134 658.5 M490 512.4 L583 658" fill="none" stroke="#000"
          stroke-width="15"/>
  </g>
</svg>
