<!-- The macOS menu bar extra: the keycap from keyhac-win's icon.svg as an
     AppKit template image, loaded directly by NSImage at runtime (macOS
     11+). Maintained by hand, in step with art/icon.svg: same geometry,
     drawn as line art - solid outline plus solid interior edges, faces
     open. Ink is binary; alpha appears only from anti-aliasing, so the
     icon matches the other menu extras instead of letting the menu bar
     bleed through translucent shading (the system recolors the ink for
     dark mode / menu highlight). Canvas 20.4x18pt with the ink at
     20x16pt: 16pt matches the tallest neighboring menu extras (measured
     against the system icons), and the canvas is wider than tall because
     the keycap is - menu extra images need not be square. Keep it inside
     the SVG subset of tools/svgrender.py - the icon build
     (tools/make_icons.py) lints this file against it. -->
<svg xmlns="http://www.w3.org/2000/svg" width="20.4" height="18"
     viewBox="0 0 20.4 18">
  <g transform="translate(-3.8865 -10.0748) scale(0.039293)">
    <path d="M240 312.4 L470 312.4 L544 364 L583 658 L134 658.5 L172.5 365 Z" fill="none" stroke="#000"
          stroke-width="60" stroke-linejoin="round"/>
    <path d="M240 312.4 L220 512.4 M220 512.4 L490 512.4 M470 312.4 L490 512.4 M220 512.4 L134 658.5 M490 512.4 L583 658" fill="none" stroke="#000"
          stroke-width="30"/>
  </g>
</svg>
